<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found - SeyGo Admin</title>
    <script>
      var search = window.location.search;
      if (search.indexOf('?p=') === 0) {
        var p = decodeURIComponent(search.slice(3));
        window.history.replaceState(null, null, p || '/');
      } else {
        window.location.href = '/?p=' + encodeURIComponent(window.location.pathname + window.location.search + window.location.hash);
      }
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
